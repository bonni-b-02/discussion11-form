
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Engaged Learning Student Feedback</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <main>
        <h1>Engaged Learning Student Feedback Form</h1>

        <p>
            Share your engaged learning experience to help
            improve resources and support for UMSI students.
        </p>
 
        <!-- Uncomment the line below and connect to Formspree -->
            <form
        action="https://formspree.io/f/xvkaorje"
        method="POST"
            >


        <fieldset>
            <legend>Student Information</legend>

            <label for="first-name">First Name:*</label>
            <input type="text" id="first-name" name = "first-name" required>

            <label for="last-name">Last Name:*</label>
            <input type="text" id="last-name" name = "last-name" required>

            <label for="email">Email Address:*</label>
            <input type="email" id="email" name="email" required>

            <label for="program">Academic Program:*</label>
            <select id="program" name="program_type" required>
                <option value="">Select your program</option>
                <option value="bsi">BSI</option>
                <option value="msi">MSI</option>
                <option value="mhi">MHI</option>
                <option value="phd">PhD</option>
                <option value="other">Other</option>
            </select>

        </fieldset>

        <div class="radio-group">
            <fieldset> 
            <legend>Current or Most Recent Project Stage:</legend>

            <input type="radio" id="preparing"
                   name="project_stage_preparing" value="preparing" required>
            <label>Preparing for the Experience</label>

            <input type="radio" id="starting"
                   name="project_stage_starting" value="starting">
            <label for="starting"> Starting the Experience</label>

            <input type="radio" id="during"
                   name="project_stage_during" value="during">
            <label for="during">During the Experience</label>

            <input type="radio" id="ending"
                   name="project_stage_ending" value="ending">
            <label for="ending">Ending the Experience</label>

            <input type="radio" id="after"
                   name="project_stage_after" value="after">
            <label for="after">After the Experience</label>
            </fieldset>
        </div>

        <fieldset>
            <legend>Your Feedback</legend>

    
            <label for = "date"> Input Program start date </label>
                    <input type = "date" id = "date"
            name = "program_date" value = "date">

            <label for="feedback">Your Feedback:</label>
            <textarea name="feedback_area" rows="5" ></textarea>

        </fieldset>

        <input type="submit" value="Submit Feedback">

        </form>
    </main>
</body>

</html>
